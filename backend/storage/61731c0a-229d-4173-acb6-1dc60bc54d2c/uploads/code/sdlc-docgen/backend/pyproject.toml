[project]
name = "sdlc-docgen-backend"
version = "0.1.0"
description = "Automated SDLC document generation backend (FastAPI)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]
